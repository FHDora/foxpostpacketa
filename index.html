<!DOCTYPE html>
<html>

  
  <iframe frameborder="0" loading="lazy" src="https://cdn.foxpost.hu/apt-finder/v1/app/" width="100%" height="450"></iframe>
</head>

function receiveMessage(event) {
    // if (event.origin !== 'https://cdn.foxpost.hu') {return};
    var apt = JSON.parse(event.data);

    console.log(apt.name, apt.findme);
}

window.addEventListener('message', receiveMessage, false);


  <script>

    const button = document.getElementById("packetaBtn");

    button.addEventListener("click", function () {

      Packeta.Widget.pick(

        "c095c4161ceee39f",

        function (point) {
          
          if (!point || !point.name) {
            alert("Nincs kiválasztott csomagpont!");
            return;
          }

          const place = String(point.place ||"").trim();
          
          const name = String(point.name ||"").trim();
          
          const id = String(point.id ||"").trim();
          
          const params = new
          URLSearchParams(window.location.search);

          const returnUrl = 
            params.get("returnUrl") ||
            "https://tally.so/r/RGNKA4#packeta";
          
          const tallyUrl =
            returnUrl
            + "?packeta_place="
            + encodeURIComponent(place)
            + "&packeta_name="
            + encodeURIComponent(name)
            + "&packeta_id="
            + encodeURIComponent(id);

          document.body.innerHTML =
  "<h2 style='font-family:sans-serif;text-align:center;padding-top:40px;'>Csomagpont kiválasztva.<br>Visszairányítás...</h2>";

setTimeout(function () {

  window.location.href = tallyUrl;

}, 1000);


        }

      );

    });

  </script>

</body>

</html>
